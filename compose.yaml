services:
  php:
    build: ./docker/php
    volumes:
      - ./api:/var/www/api
    depends_on:
      database:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./api:/var/www/api:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php

  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: capital
      POSTGRES_USER: capital
      POSTGRES_PASSWORD: capital
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U capital -d capital"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data:
